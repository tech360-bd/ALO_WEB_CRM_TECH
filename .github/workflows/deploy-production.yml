# cPanel-only production entry. No hosting transport is assumed.
# CI is reusable; deployment deliberately fails until a verified provider
# contract can enforce exact-SHA delivery, persistent storage and managed restart.
name: ALO Education Production Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alo-production-deploy
  cancel-in-progress: false
jobs:
  validate-and-build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SKIP_MIGRATIONS: 'true'
    steps:
      - name: Require verified cPanel deployment contract
        run: |
          echo "::error::BLOCKED: cPanel provider, Node runtime, application root, exact-commit deployment mechanism and managed restart are not verified. See CPANEL-DEPLOYMENT-GUIDE.md. No deployment or database change attempted."
          exit 1
