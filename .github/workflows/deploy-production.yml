# Historical entry retained as a refusal notice, NOT a deployment mechanism.
name: Production deployment disabled — Hostinger owned
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership-notice:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse production changes from GitHub Actions
        run: |
          echo "BLOCKED: GitHub Actions owns CI only. Hostinger production configuration must be verified separately. No deployment or recovery performed."
          exit 1
