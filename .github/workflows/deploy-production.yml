# ============================================================================
# ALO Education — Production Deployment (aloeducation.com, PM2 alo-education, port 3044).
#
# Pipeline: push to main (or workflow_dispatch, or workflow_call from
# deploy-recovery.yml) → validate-and-build gate on the runner (secrets check,
# npm ci, prisma validate/generate, lint, typecheck, BLOCKING tests, production
# build) → SSH deploy of the EXACT validated commit SHA → health checks →
# automatic rollback on deploy/health failure.
#
# Safety properties:
#   * concurrency group prevents overlapping deployments (never cancelled mid-flight)
#   * deploy job runs in the protected `production` GitHub Environment
#   * least-privilege permissions (contents: read)
#   * SSH host key PINNED via vars.DEPLOY_HOST_SSH_FINGERPRINT (host-key
#     checking is NOT disabled; missing fingerprint fails the run early)
#   * SSH port is REQUIRED via secrets.DEPLOY_PORT — there is NO silent
#     fallback to port 22; the gate rejects a missing, non-numeric, or
#     out-of-range port with an actionable error before anything runs
#   * a read-only TCP preflight classifies SSH reachability (DNS / refused /
#     filtered-timeout / open) before the authenticated SSH step, so a network
#     problem can never be mistaken for a credential problem (and vice versa)
#   * actions pinned to reviewed immutable commit SHAs (see comments)
#   * VPS git fetch authenticates with the ephemeral GITHUB_TOKEN via an
#     inline credential helper — the token is never written to .git/config,
#     never echoed, and auto-masked in logs
#   * deploys the exact tested SHA, not a moving branch ref
#   * backups of .env/storage/uploads before replacing code; NO git clean -fdx
#   * migrations only on explicit operator opt-in (skip_migrations defaults true)
#   * docs-only pushes do not trigger a deployment (paths-ignore)
#   * health-check failure triggers a bounded automatic rollback to the
#     previously deployed commit, with diagnostics preserved either way
# ============================================================================

name: ALO Education Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (40-char commit SHA recommended) to deploy — defaults to the commit this run starts from'
        required: false
        default: ''
        type: string
      skip_migrations:
        description: 'Skip Prisma migrations (safe default true — migrations require a verified backup + review first)'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit SHA to deploy (validated by the caller)'
        required: true
        type: string
      skip_migrations:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: alo-production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  APP_PORT: '3044'
  PM2_NAME: 'alo-education'
  PRIMARY_DOMAIN: 'aloeducation.com'
  TARGET_REPO: 'engralaminn-collab/alo_education_z....ai'
  DEPLOY_DIR: '/root/alo-github-main'

jobs:
  # ==========================================================================
  # GATE 1 — validate the exact commit and build it on a clean runner.
  # If anything here fails, nothing touches production.
  # ==========================================================================
  validate-and-build:
    name: Validate & Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy_ref: ${{ steps.resolve_ref.outputs.deploy_ref }}
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — pinned to immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve deployment ref to an exact SHA
        id: resolve_ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.sha }}"
          if [ -z "$REF" ]; then REF="$(git rev-parse HEAD)"; fi
          if git rev-parse --verify "$REF^{commit}" >/dev/null 2>&1; then
            FULL_SHA="$(git rev-parse "$REF^{commit}")"
          else
            echo "::error::Ref '$REF' does not resolve to a commit in this repository"
            exit 1
          fi
          echo "deploy_ref=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref: $FULL_SHA (input: '${{ inputs.ref || github.sha }}')"
          git log -1 --format='Commit: %H%nAuthor: %an <%ae>%nDate:   %ad%nSubject:%s' "$FULL_SHA"

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL=$(git remote get-url origin)
          echo "Remote URL host/path check (token redacted):"
          echo "$REMOTE_URL" | sed -E 's#//[^@]*@#//***@#'
          if ! echo "$REMOTE_URL" | grep -q "${TARGET_REPO}"; then
            echo "::error::Remote URL does not match expected ${TARGET_REPO} — aborting to protect a wrong repository"
            exit 1
          fi
          echo "✓ Repository identity verified"

      - name: Verify deployment configuration presence (names only, never values)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is missing — add it in GitHub Settings → Secrets and variables → Actions"
              missing=1
            else
              echo "✓ $v present"
            fi
          done
          # DEPLOY_PORT is MANDATORY (policy: no silent fallback to port 22).
          # It must be an explicit, numeric, in-range TCP port.
          if [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::DEPLOY_PORT is missing — the SSH port must be configured explicitly; the silent fallback to port 22 was removed by deployment policy."
            echo "::error::Add repository secret DEPLOY_PORT (Settings → Secrets and variables → Actions) with the VPS's REAL SSH port. Verify it on the server console first:  ss -tlnp | grep sshd"
            missing=1
          else
            case "$DEPLOY_PORT" in
              0[0-9]*)
                echo "::error::DEPLOY_PORT '$DEPLOY_PORT' has a leading zero — provide the port as a plain decimal number without leading zeros."
                missing=1 ;;
              ''|*[!0-9]*)
                echo "::error::DEPLOY_PORT must be a positive integer (1–65535) — got a non-numeric value."
                missing=1 ;;
              *)
                if [ "$((10#$DEPLOY_PORT))" -ge 1 ] && [ "$((10#$DEPLOY_PORT))" -le 65535 ]; then
                  echo "✓ DEPLOY_PORT present (numeric, in range 1–65535)"
                else
                  echo "::error::DEPLOY_PORT '$DEPLOY_PORT' is out of range — it must be between 1 and 65535."
                  missing=1
                fi ;;
            esac
          fi
          if [ -z "${HOST_FINGERPRINT:-}" ]; then
            echo "::error::Repository variable DEPLOY_HOST_SSH_FINGERPRINT is missing — host-key pinning is mandatory."
            echo "::error::Create it with:  ssh-keyscan -p <DEPLOY_PORT> <DEPLOY_HOST> | ssh-keygen -lf -   (use the ed25519 line, format SHA256:...)"
            missing=1
          else
            case "$HOST_FINGERPRINT" in
              SHA256:*) echo "✓ DEPLOY_HOST_SSH_FINGERPRINT present (SHA256 format)" ;;
              *) echo "::error::DEPLOY_HOST_SSH_FINGERPRINT must look like SHA256:... (got a different format)"; missing=1 ;;
            esac
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Setup Node.js
        # actions/setup-node v7.0.0 — pinned to immutable SHA
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo "::error::package-lock.json missing — CI must install from a committed lockfile"; exit 1; }
          npm ci

      - name: Prisma validate
        shell: bash
        env:
          # Dummy value ONLY so the CLI can resolve env("DATABASE_URL") during
          # schema validation on the clean runner (no .env in Git, no connection
          # made). Step-scoped: the Tests step must see NO DATABASE_URL so the
          # DB-integration files self-skip with reason.
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy_build_check"
        run: |
          set -euo pipefail
          npx prisma validate
          echo "✓ Prisma schema valid"

      - name: Prisma generate
        shell: bash
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy_build_check"
        run: |
          set -euo pipefail
          npx prisma generate
          echo "✓ Prisma client generated"

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Provision swap (tsc on this repo needs >4GB effective memory; standard runners have ~7GB RAM)
        shell: bash
        run: |
          set -euo pipefail
          # Same OOM class as CI run 35161361303 (tsc exit 134). Proven local
          # recipe: raised heap limit + swap.
          if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Typecheck
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Tests (blocking — failures stop the deployment)
        shell: bash
        run: |
          set -euo pipefail
          # DB-integration tests self-skip (and are reported as skipped) when no
          # disposable test DATABASE_URL is configured — they never run against
          # production and are never counted as passed.
          npm test

      - name: Production build (clean-runner validation)
        shell: bash
        env:
          # Dummy values ONLY for build validation on the runner. Real values
          # live exclusively in the VPS .env (never in Git, never in logs).
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy_build_check"
          NEXTAUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          AUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          JWT_SECRET: "dummy-build-secret-for-validation-only-32chars"
          SESSION_SECRET: "dummy-build-secret-for-validation-only-32chars"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_URL: "https://aloeducation.com"
          NEXT_PUBLIC_APP_URL: "https://aloeducation.com"
          FILE_SIGN_SECRET: "dummy-file-sign-secret-must-be-32-chars-long-at-least"
        run: |
          set -euo pipefail
          npm run build
          test -f .next/standalone/server.js || { echo "::error::.next/standalone/server.js missing after build"; exit 1; }
          echo "✓ Production build succeeded on runner"

  # ==========================================================================
  # GATE 2 — deploy the exact validated SHA to the VPS, then health-check.
  # Runs in the protected `production` environment (add required reviewers in
  # Settings → Environments → production for manual approval).
  # ==========================================================================
  deploy:
    name: Deploy complete repository to AlmaLinux VPS
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: needs.validate-and-build.result == 'success'
    timeout-minutes: 60
    environment: production

    steps:
      - name: TCP preflight
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          echo "Checking SSH reachability: $DEPLOY_HOST:$DEPLOY_PORT"
          getent hosts "$DEPLOY_HOST" >/dev/null 2>&1 || {
            echo "::error::DNS resolution failed for $DEPLOY_HOST"
            exit 1
          }
          timeout 15 bash -c "exec 3<>/dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT" || {
            echo "::error::Cannot reach $DEPLOY_HOST:$DEPLOY_PORT"
            exit 1
          }
          echo "✓ TCP reachable"

      - name: Deploy via SSH
        id: deploy_ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_REF: ${{ needs.validate-and-build.outputs.deploy_ref }}
          APP_PORT: ${{ env.APP_PORT }}
          PM2_NAME: ${{ env.PM2_NAME }}
          PRIMARY_DOMAIN: ${{ env.PRIMARY_DOMAIN }}
          TARGET_REPO: ${{ env.TARGET_REPO }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ vars.DEPLOY_HOST_SSH_FINGERPRINT }}
          envs: DEPLOY_REF,APP_PORT,PM2_NAME,PRIMARY_DOMAIN,TARGET_REPO,DEPLOY_DIR,GH_FETCH_TOKEN
          command_timeout: 40m
          script: |
            set -euo pipefail

            APP_DIR="$DEPLOY_DIR"
            cd "$APP_DIR"

            echo "============================================================"
            echo " ALO EDUCATION PRODUCTION DEPLOYMENT"
            echo "============================================================"
            echo "Target SHA : $DEPLOY_REF"
            echo "Directory  : $APP_DIR"
            echo "App        : $PM2_NAME"
            echo "Port       : $APP_PORT"
            echo "Node       : $(node -v)"
            echo "npm        : $(npm -v)"
            echo "PM2        : $(pm2 -v)"
            echo "============================================================"

            NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
            NPM_MAJOR="$(npm -v | cut -d. -f1)"

            [ "$NODE_MAJOR" = "22" ] || {
              echo "::error::Node.js 22 required, found $(node -v)"
              exit 1
            }

            [ "$NPM_MAJOR" = "10" ] || {
              echo "::error::npm 10 required, found $(npm -v)"
              exit 1
            }

            # Preserve VPS-only production data.
            BACKUP_DIR=".deploy-backup-$(date +%Y%m%d-%H%M%S)-${DEPLOY_REF:0:7}"
            mkdir -p "$BACKUP_DIR"

            [ -f .env ] && cp -p .env "$BACKUP_DIR/.env"
            [ -d storage ] && cp -a storage "$BACKUP_DIR/storage"
            [ -d uploads ] && cp -a uploads "$BACKUP_DIR/uploads"
            if [ -d public/uploads ]; then
              mkdir -p "$BACKUP_DIR/public"
              cp -a public/uploads "$BACKUP_DIR/public/uploads"
            fi

            PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "$PREVIOUS_SHA" > .deploy-prev-commit

            # Ensure Git repository is correctly initialized.
            if [ ! -d .git ]; then
              git init
            fi

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "https://github.com/$TARGET_REPO.git"
            else
              git remote add origin "https://github.com/$TARGET_REPO.git"
            fi

            # Fetch ALL branches and tags, then deploy EXACT validated SHA.
            git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_FETCH_TOKEN}"; }; f'               fetch origin --prune               "+refs/heads/*:refs/remotes/origin/*"               "+refs/tags/*:refs/tags/*"

            unset GH_FETCH_TOKEN

            git cat-file -e "$DEPLOY_REF^{commit}"

            git checkout --force "$DEPLOY_REF"

            ACTUAL_SHA="$(git rev-parse HEAD)"
            [ "$ACTUAL_SHA" = "$DEPLOY_REF" ] || {
              echo "::error::Exact SHA verification failed"
              echo "Expected: $DEPLOY_REF"
              echo "Actual:   $ACTUAL_SHA"
              exit 1
            }

            echo "✓ Exact commit deployed: $ACTUAL_SHA"

            # Verify complete project files. These must remain in the deployed repository.
            REQUIRED_FILES=(
              "package.json"
              "package-lock.json"
              "prisma/schema.prisma"
              "next.config.ts"
              "ecosystem.config.cjs"
              "Dockerfile"
              ".dockerignore"
              "docker-compose.yml"
              ".github/workflows/ci.yml"
              ".github/workflows/deploy-production.yml"
              ".github/workflows/deploy-recovery.yml"
              ".github/workflows/health-monitor.yml"
            )

            for FILE in "${REQUIRED_FILES[@]}"; do
              [ -f "$FILE" ] || {
                echo "::error::Required project file missing: $FILE"
                exit 1
              }
              echo "✓ $FILE"
            done

            TRACKED_COUNT="$(git ls-files | wc -l | tr -d ' ')"
            echo "✓ Complete Git-tracked file count: $TRACKED_COUNT"

            # Restore VPS-only production data.
            if [ -f "$BACKUP_DIR/.env" ]; then
              cp -p "$BACKUP_DIR/.env" .env
              chmod 600 .env
            fi

            if [ -d "$BACKUP_DIR/storage" ]; then
              rm -rf storage
              cp -a "$BACKUP_DIR/storage" storage
            fi

            if [ -d "$BACKUP_DIR/uploads" ]; then
              rm -rf uploads
              cp -a "$BACKUP_DIR/uploads" uploads
            fi

            if [ -d "$BACKUP_DIR/public/uploads" ]; then
              mkdir -p public
              rm -rf public/uploads
              cp -a "$BACKUP_DIR/public/uploads" public/uploads
            fi

            [ -f .env ] || {
              echo "::error::.env missing on VPS"
              exit 1
            }

            # Reproducible install.
            rm -rf node_modules
            npm ci

            # Prisma.
            npx prisma validate
            npx prisma generate

            # Build native Node/PM2 production. Docker is not used.
            mkdir -p storage/logs
            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            [ -f .next/standalone/server.js ] || {
              echo "::error::.next/standalone/server.js missing after build"
              exit 1
            }

            # PM2 only.
            if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
              if [ -f ecosystem.config.cjs ]; then
                pm2 restart ecosystem.config.cjs --update-env
              else
                pm2 restart "$PM2_NAME" --update-env
              fi
            else
              if [ -f ecosystem.config.cjs ]; then
                pm2 start ecosystem.config.cjs --env production
              else
                PORT="$APP_PORT" HOSTNAME=0.0.0.0 NODE_ENV=production                   pm2 start .next/standalone/server.js --name "$PM2_NAME"
              fi
            fi

            pm2 save

            # Wait for the application.
            READY=0
            for i in $(seq 1 45); do
              if ss -tln | grep -q ":$APP_PORT "; then
                READY=1
                break
              fi
              sleep 2
            done

            [ "$READY" = "1" ] || {
              echo "::error::Port $APP_PORT did not start"
              pm2 logs "$PM2_NAME" --lines 150 --nostream || true
              exit 1
            }

            HEALTH="$(curl -fsS --max-time 15 "http://127.0.0.1:$APP_PORT/api/health")"
            echo "Health: \$HEALTH"

            case "$HEALTH" in
              *'"status":"ok"'*) echo "✓ Health OK" ;;
              *) echo "::error::Health endpoint did not return status ok"; exit 1 ;;
            esac

            PUBLIC_CODE="$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 20 "https://$PRIMARY_DOMAIN/api/health" || true)"
            echo "Public health HTTP: \$PUBLIC_CODE"

            echo "============================================================"
            echo " DEPLOYMENT SUCCESS"
            echo "============================================================"
            echo "SHA     : $(git rev-parse HEAD)"
            echo "Node    : $(node -v)"
            echo "npm     : $(npm -v)"
            echo "PM2     : $(pm2 -v)"
            echo "Port    : \$APP_PORT"
            echo "Files   : \$TRACKED_COUNT"
            echo "============================================================"

      - name: Automatic rollback
        if: failure() && steps.deploy_ssh.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          APP_PORT: ${{ env.APP_PORT }}
          PM2_NAME: ${{ env.PM2_NAME }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ vars.DEPLOY_HOST_SSH_FINGERPRINT }}
          envs: APP_PORT,PM2_NAME,DEPLOY_DIR
          command_timeout: 30m
          script: |
            set -uo pipefail
            cd "$DEPLOY_DIR"

            [ -f .deploy-prev-commit ] || {
              echo "::error::No previous commit recorded"
              exit 1
            }

            PREV="$(cat .deploy-prev-commit)"

            [ "$PREV" != "unknown" ] || {
              echo "::error::Unknown previous commit"
              exit 1
            }

            git checkout --force "$PREV"

            rm -rf node_modules
            npm ci
            npx prisma generate || true
            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            pm2 restart "$PM2_NAME" --update-env || true

            sleep 5

            curl -fsS --max-time 15 "http://127.0.0.1:$APP_PORT/api/health" >/dev/null || {
              echo "::error::Rollback health check failed"
              pm2 logs "$PM2_NAME" --lines 100 --nostream || true
              exit 1
            }

            echo "✓ Rollback completed to $PREV"

      - name: Public verification
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for URL in             "https://aloeducation.com/"             "https://aloeducation.com/api/health"             "https://aloeducation.com/universities"             "https://aloeducation.com/courses"             "https://aloeducation.com/destinations"
          do
            CODE="$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 20 -L "$URL" || true)"
            echo "$URL -> HTTP \$CODE"
          done
