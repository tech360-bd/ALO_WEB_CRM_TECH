- name: Verify deployment secrets
  shell: bash
  env:
    DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  run: |
    set -euo pipefail

    test -n "$DEPLOY_HOST" || {
      echo "::error::DEPLOY_HOST is missing or empty"
      exit 1
    }

    test -n "$DEPLOY_USER" || {
      echo "::error::DEPLOY_USER is missing or empty"
      exit 1
    }

    test -n "$DEPLOY_SSH_KEY" || {
      echo "::error::DEPLOY_SSH_KEY is missing or empty"
      exit 1
    }

    echo "Deployment SSH configuration is present."
