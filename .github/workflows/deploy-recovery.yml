# No rollback may guess the hosting release switch or alter persistent data.
name: cPanel Recovery — configuration required
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alo-production-deploy
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Require verified hosting recovery procedure
        run: |
          echo "::error::BLOCKED: cPanel release selection and managed restart are not configured. No recovery attempted. See ROLLBACK-GUIDE.md."
          exit 1
