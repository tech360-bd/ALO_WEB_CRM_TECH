# Public ALO Education checks only; no hosting restart or database changes.
name: Health & Dependency Monitor

on:
  schedule:
    - cron: '30 3 * * *'   # daily 03:30 UTC (~09:30 Dhaka)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-monitor
  cancel-in-progress: true

jobs:
  production-health:
    name: Public production health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Public readiness and anonymous smoke checks
        run: node scripts/production-smoke.mjs https://aloeducation.com

  dependency-audit:
    name: Dependency vulnerability audit (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1 — pinned to immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run audit only on Mondays (or manual dispatch)
        id: gate
        shell: bash
        run: |
          DOW=$(date -u +%u)   # 1 = Monday
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$DOW" = "1" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "Not Monday and not manual — skipping audit (avoiding daily noise)"
          fi

      - name: npm audit (lockfile only — production deps)
        if: steps.gate.outputs.run == '1'
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --package-lock-only --audit-level=high
