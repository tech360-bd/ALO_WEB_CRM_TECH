# LEGACY / NOT USED FOR CURRENT PRODUCTION — Hostinger only; app container startup disabled.
version: "3.9"

services:
  app:
    build: .
    container_name: alo-education
    restart: unless-stopped
    ports:
      - "3044:3044"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-aloeduca_ALO_final_web_crm}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-aloeduca_alo_education}
    volumes:
      - ./upload:/app/upload
      - ./download:/app/download
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alo-network

  db:
    image: mysql:8.4
    container_name: alo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aloeduca_alo_education}
      MYSQL_USER: ${MYSQL_USER:-aloeduca_ALO_final_web_crm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    # Do not expose MySQL to host in production (SEC-18) — app reaches via internal network
    # Uncomment only for local dev debugging: - "127.0.0.1:3306:3306"
    volumes:
      - alo-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - alo-network

  nginx:
    image: nginx:alpine
    container_name: alo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - alo-network

volumes:
  alo-mysqldata:

networks:
  alo-network:
    driver: bridge
