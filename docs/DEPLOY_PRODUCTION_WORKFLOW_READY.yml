name: ALO Education Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (commit SHA, branch, or tag) to deploy — defaults to main HEAD'
        required: false
        default: 'main'
        type: string
      skip_migrations:
        description: 'Skip Prisma migrations (safe default true)'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '22'
  APP_PORT: '3044'
  PM2_NAME: 'alo-education'
  PRIMARY_DOMAIN: 'aloeducation.com'
  TARGET_REPO: 'engralaminn-collab/alo_education_z....ai'
  PROTECTED_PM2: 'alo-learning-journey'
  PROTECTED_PORT: '3017'
  PROTECTED_DOMAIN: 'learn.aloeducation.com'

jobs:
  validate-and-build:
    name: Validate & Build (Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy_ref: ${{ steps.resolve_ref.outputs.deploy_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve deployment ref
        id: resolve_ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.sha }}"
          if [ "$REF" = "main" ]; then
            REF="$(git rev-parse HEAD)"
          fi
          if git rev-parse --verify "$REF" >/dev/null 2>&1; then
            FULL_SHA="$(git rev-parse "$REF")"
          else
            FULL_SHA="$REF"
          fi
          echo "deploy_ref=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref: $FULL_SHA (input: ${{ inputs.ref || github.sha }})"

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL=$(git remote get-url origin)
          echo "Remote URL: $REMOTE_URL"
          if ! echo "$REMOTE_URL" | grep -q "${{ env.TARGET_REPO }}"; then
            echo "::error::Remote URL $REMOTE_URL does not match expected ${{ env.TARGET_REPO }} — aborting to protect wrong repo"
            exit 1
          fi
          echo "✓ Repository identity verified: $REMOTE_URL"

      - name: Verify deployment secrets presence (no values printed)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          echo "Checking required deployment secrets..."
          missing=0
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::DEPLOY_HOST is missing — add in GitHub Settings → Secrets and variables → Actions"
            missing=1
          else
            echo "✓ DEPLOY_HOST present"
          fi
          if [ -z "${DEPLOY_USER:-}" ]; then
            echo "::error::DEPLOY_USER is missing"
            missing=1
          else
            echo "✓ DEPLOY_USER present"
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY is missing"
            missing=1
          else
            len=$(echo -n "$DEPLOY_SSH_KEY" | wc -c)
            echo "✓ DEPLOY_SSH_KEY present (len $len)"
            if [ "$len" -lt 100 ]; then
              echo "::error::DEPLOY_SSH_KEY too short"
              missing=1
            fi
          fi
          if [ -n "${DEPLOY_PORT:-}" ]; then
            echo "✓ DEPLOY_PORT: ${DEPLOY_PORT}"
          else
            echo "ℹ DEPLOY_PORT not set — using 22"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Missing secrets — configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, optional DEPLOY_PORT"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (lockfile)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prisma validate
        shell: bash
        run: |
          set -euo pipefail
          npx prisma validate
          echo "✓ Prisma schema valid (provider mysql)"

      - name: Prisma generate
        shell: bash
        run: |
          set -euo pipefail
          npx prisma generate
          echo "✓ Prisma client generated"

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -q "lint"; then
            npm run lint
            echo "✓ Lint passed"
          else
            echo "No lint script"
          fi

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -q "typecheck"; then
            npm run typecheck
            echo "✓ Typecheck passed"
          else
            echo "No typecheck script"
          fi

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -q '"test"'; then
            npm run test || echo "::warning::Tests failed — review but not blocking"
          else
            echo "No test script"
          fi

      - name: Production build (runner validation with dummy env)
        shell: bash
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy_build_check"
          NEXTAUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          AUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          JWT_SECRET: "dummy-build-secret-for-validation-only-32chars"
          SESSION_SECRET: "dummy-build-secret-for-validation-only-32chars"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_URL: "https://aloeducation.com"
          NEXT_PUBLIC_APP_URL: "https://aloeducation.com"
          FILE_SIGN_SECRET: "dummy-file-sign-secret-must-be-32-chars-long-at-least"
        run: |
          set -euo pipefail
          echo "Running production build for validation..."
          RAYON_NUM_THREADS=1 UV_THREADPOOL_SIZE=1 NEXT_PRIVATE_BUILD_WORKER=0 NODE_OPTIONS='--max-old-space-size=4096' npm run build
          echo "✓ Production build succeeded"
          ls -lh .next/standalone/server.js
          ls -lh .next/static | head -n 20

  deploy:
    name: Deploy to VPS (SSH) — Safe, No Touch Protected Service
    runs-on: ubuntu-latest
    needs: validate-and-build
    timeout-minutes: 30
    if: needs.validate-and-build.result == 'success'
    steps:
      - name: Checkout repository (for ref info)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Deploy via SSH — safe production deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ needs.validate-and-build.outputs.deploy_ref || github.sha }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
          APP_PORT: ${{ env.APP_PORT }}
          PM2_NAME: ${{ env.PM2_NAME }}
          PRIMARY_DOMAIN: ${{ env.PRIMARY_DOMAIN }}
          TARGET_REPO: ${{ env.TARGET_REPO }}
          PROTECTED_PM2: ${{ env.PROTECTED_PM2 }}
          PROTECTED_PORT: ${{ env.PROTECTED_PORT }}
          PROTECTED_DOMAIN: ${{ env.PROTECTED_DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_REF,SKIP_MIGRATIONS,APP_PORT,PM2_NAME,PRIMARY_DOMAIN,TARGET_REPO,PROTECTED_PM2,PROTECTED_PORT,PROTECTED_DOMAIN
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            echo "============================================================"
            echo " ALO Education Production Deployment"
            echo " Deploy Ref: $DEPLOY_REF | Skip Migrations: $SKIP_MIGRATIONS"
            echo " App Port: $APP_PORT | PM2: $PM2_NAME | Domain: $PRIMARY_DOMAIN"
            echo " Protected: PM2 $PROTECTED_PM2 | Port $PROTECTED_PORT | Domain $PROTECTED_DOMAIN"
            echo " Target Repo: $TARGET_REPO"
            echo "============================================================"

            # ---- 0. PROTECT EXISTING LIVE SERVICE (CRITICAL SAFETY) ----
            echo "=== SAFETY: Protecting existing live service $PROTECTED_PM2 ==="
            echo "Checking if protected PM2 process exists — MUST NOT TOUCH"
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe "$PROTECTED_PM2" >/dev/null 2>&1; then
                echo "⚠ Protected process $PROTECTED_PM2 FOUND — will NOT stop/delete/reset/reconfigure it"
                pm2 describe "$PROTECTED_PM2" | head -n 40 || true
                # Verify its port
                ss -tlnp | grep -E ":$PROTECTED_PORT" || echo "Port $PROTECTED_PORT not listening (may be internal)"
              else
                echo "Protected process $PROTECTED_PM2 not found — OK, no action needed"
              fi
            else
              echo "PM2 not found yet — protected process check skipped (will be installed)"
            fi

            echo "Checking protected domain $PROTECTED_DOMAIN in Nginx/Caddy"
            if [ -f /etc/nginx/sites-enabled/default ] || [ -d /etc/nginx/conf.d ] || [ -f /etc/nginx/nginx.conf ]; then
              grep -R "$PROTECTED_DOMAIN" /etc/nginx/ 2>/dev/null | head -n 20 || echo "No Nginx config for $PROTECTED_DOMAIN found (may be separate file)"
            fi
            if [ -f /etc/caddy/Caddyfile ]; then
              grep -n "$PROTECTED_DOMAIN" /etc/caddy/Caddyfile | head -n 20 || echo "No Caddy config for $PROTECTED_DOMAIN (expected, as Caddy may use separate site)"
            fi
            echo "✓ Protected service check complete — will NOT modify $PROTECTED_PM2, port $PROTECTED_PORT, or $PROTECTED_DOMAIN"

            # ---- 1. Detect deployment directories (non-destructive) ----
            CANDIDATE_DIRS=(
              "/root/alo-github-main-new"
              "/root/alo-github-main"
              "/root/alo-live"
              "/home/aloeduca/alo-education"
              "/home/aloeduca/alo-web-crm"
              "/opt/alo-education"
            )
            DEPLOY_DIR=""
            echo "Inspecting candidate dirs for existing checkout:"
            for d in "${CANDIDATE_DIRS[@]}"; do
              if [ -d "$d" ]; then
                echo "  $d exists: $(ls -ld "$d")"
                if [ -d "$d/.git" ]; then
                  REMOTE=$(cd "$d" && git remote get-url origin 2>/dev/null || echo "no-remote")
                  echo "    -> git repo, remote: $REMOTE"
                  # Only consider if remote matches target OR if it's the intended dir
                  if echo "$REMOTE" | grep -q "$TARGET_REPO" || [ "$d" = "/root/alo-github-main-new" ]; then
                    if [ -z "$DEPLOY_DIR" ]; then
                      DEPLOY_DIR="$d"
                    fi
                  fi
                else
                  echo "    -> not a git repo (may contain user data, will NOT delete)"
                  ls -la "$d" | head -n 20 || true
                  du -sh "$d" 2>/dev/null | head -n 5 || true
                fi
              else
                echo "  $d not found"
              fi
            done

            # Prefer intended directory per spec
            if [ -d "/root/alo-github-main-new/.git" ]; then
              DEPLOY_DIR="/root/alo-github-main-new"
              echo "Using intended directory per spec: $DEPLOY_DIR"
            elif [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="/root/alo-github-main-new"
              echo "No existing valid checkout found, will use intended: $DEPLOY_DIR"
            fi

            echo "Final DEPLOY_DIR: $DEPLOY_DIR"

            # ---- 2. Ensure deploy dir exists and is correct repo (safe) ----
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Creating deploy dir: $DEPLOY_DIR"
              mkdir -p "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              echo "Initializing git repo in $DEPLOY_DIR"
              # Inspect before init — preserve any user files
              echo "Existing files in $DEPLOY_DIR (if any, will be preserved):"
              ls -la | head -n 30 || true
              git init
              git remote add origin "https://github.com/${TARGET_REPO}.git" || git remote set-url origin "https://github.com/${TARGET_REPO}.git"
            fi

            echo "Verifying remote is exactly target repo:"
            REMOTE_URL=$(git remote get-url origin)
            echo "  Remote: $REMOTE_URL"
            if ! echo "$REMOTE_URL" | grep -q "$TARGET_REPO"; then
              echo "::error::Remote $REMOTE_URL does not match expected $TARGET_REPO — aborting to prevent overwriting wrong app"
              echo "If this is intentional, manually set remote to https://github.com/${TARGET_REPO}.git"
              exit 1
            fi
            echo "✓ Remote verified"

            git status --porcelain || true
            git log --oneline -3 || true

            # ---- 3. Backup production-critical files (non-destructive) ----
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_DIR=".deploy-backup-${TIMESTAMP}-${DEPLOY_REF:0:7}"
            mkdir -p "$BACKUP_DIR"
            echo "Creating backup at $BACKUP_DIR"
            [ -f .env ] && cp -v .env "$BACKUP_DIR/.env.backup" || echo ".env not present, will need creation"
            [ -d storage ] && cp -rv storage "$BACKUP_DIR/storage" 2>&1 | tail -n 20 || echo "storage not present"
            [ -d uploads ] && cp -rv uploads "$BACKUP_DIR/uploads" 2>&1 | tail -n 20 || echo "uploads not present"
            [ -d public/uploads ] && cp -rv public/uploads "$BACKUP_DIR/public_uploads" 2>&1 | tail -n 20 || echo "public/uploads not present"
            [ -f ecosystem.config.cjs ] && cp -v ecosystem.config.cjs "$BACKUP_DIR/" || true
            [ -f Caddyfile ] && cp -v Caddyfile "$BACKUP_DIR/" || true
            [ -f nginx.conf ] && cp -v nginx.conf "$BACKUP_DIR/" || true
            echo "Backup complete"

            ENV_TMP="/tmp/alo-env-backup-${TIMESTAMP}"
            if [ -f .env ]; then
              cp -v .env "$ENV_TMP"
              echo "Preserved .env to $ENV_TMP"
            fi

            # ---- 4. Fetch and checkout exact commit (safe, no clean -fdx) ----
            echo "Fetching origin..."
            git fetch origin --prune

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            echo "Previous commit: $PREV_COMMIT"

            RESOLVED_REF="$DEPLOY_REF"
            if git rev-parse --verify "origin/$DEPLOY_REF" >/dev/null 2>&1; then
              RESOLVED_REF="origin/$DEPLOY_REF"
              echo "Resolved branch $DEPLOY_REF to $RESOLVED_REF"
            fi

            echo "Checking out $RESOLVED_REF (intended $DEPLOY_REF) — WITHOUT git clean -fdx to preserve user data"
            git checkout --force "$RESOLVED_REF" || git checkout --force origin/main || {
              echo "::error::Failed to checkout $RESOLVED_REF"
              exit 1
            }

            if [ "${#DEPLOY_REF}" -ge 7 ] && [ "${#DEPLOY_REF}" -le 40 ]; then
              if git cat-file -e "$DEPLOY_REF" 2>/dev/null; then
                echo "Checking out exact SHA: $DEPLOY_REF"
                git checkout --force "$DEPLOY_REF" || true
              fi
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Deployed commit: $NEW_COMMIT"
            echo "$NEW_COMMIT" > .deployed_commit
            echo "Deployed: $NEW_COMMIT at $(date -u) from $DEPLOY_REF (prev $PREV_COMMIT)" >> .deploy_history.log
            git log --oneline -3

            if [ -f "$ENV_TMP" ]; then
              if [ ! -f .env ]; then
                echo "Restoring .env from backup"
                cp -v "$ENV_TMP" .env
                chmod 600 .env || true
              else
                echo ".env exists after checkout — keeping existing, saving pre-restore copy if changed"
                if ! cmp -s "$ENV_TMP" .env; then
                  cp -v "$ENV_TMP" "$BACKUP_DIR/.env.pre-restore"
                fi
              fi
              rm -f "$ENV_TMP"
            else
              if [ ! -f .env ]; then
                echo "::warning::.env missing after checkout — must be created manually from .env.production.example"
                ls -lh .env.production.example .env.example 2>&1 | head -n 5 || true
              fi
            fi

            # ---- 5. Install dependencies ----
            echo "Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci || npm install
            else
              npm install
            fi

            # ---- 6. Prisma generate and safe migration handling ----
            echo "Prisma validate..."
            npx prisma validate || { echo "::error::Prisma validation failed"; exit 1; }

            echo "Prisma generate..."
            npx prisma generate || { echo "::error::Prisma generate failed"; exit 1; }

            echo "Checking migration status..."
            npx prisma migrate status || echo "::warning::migrate status reported issues — check manually"

            if [ "$SKIP_MIGRATIONS" = "true" ] || [ "$SKIP_MIGRATIONS" = "True" ] || [ "$SKIP_MIGRATIONS" = "1" ]; then
              echo "Skipping migrations per input (safe default true) — no DB schema changes"
            else
              echo "⚠ Applying migrations (prisma migrate deploy) — explicit operator choice"
              echo "Backing up DB before migration if mysqldump available (non-destructive)"
              if command -v mysqldump >/dev/null 2>&1 && [ -f .env ]; then
                echo "mysqldump available — recommend manual backup before migration"
              fi
              npx prisma migrate deploy || {
                echo "::error::Migration deploy failed — check $BACKUP_DIR, rollback may be needed"
                exit 1
              }
              echo "✓ Migrations applied"
            fi

            # ---- 7. Production build ----
            echo "Running production build..."
            mkdir -p storage/logs
            RAYON_NUM_THREADS=1 UV_THREADPOOL_SIZE=1 NEXT_PRIVATE_BUILD_WORKER=0 NODE_OPTIONS='--max-old-space-size=4096' npm run build || {
              echo "::error::Production build failed"
              exit 1
            }

            echo "Running prepare-standalone..."
            node scripts/prepare-standalone.mjs || echo "::warning::prepare-standalone failed"

            if [ ! -f .next/standalone/server.js ]; then
              echo "::error::Standalone server not found at .next/standalone/server.js"
              ls -lh .next/ || true
              ls -lh .next/standalone/ || true
              exit 1
            fi
            echo "✓ Build artifacts verified"

            # ---- 8. PM2 start/restart ONLY intended process ----
            echo "Configuring PM2 process: $PM2_NAME on port $APP_PORT — will NOT touch $PROTECTED_PM2"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found, installing globally..."
              npm install -g pm2
            fi

            echo "Checking port $APP_PORT usage..."
            ss -tlnp | grep -E ":$APP_PORT" || echo "Port $APP_PORT not currently listening"

            echo "Ensuring protected process $PROTECTED_PM2 is NOT affected..."
            if pm2 describe "$PROTECTED_PM2" >/dev/null 2>&1; then
              echo "Protected process $PROTECTED_PM2 still exists — good, we will NOT restart it"
            fi

            if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
              echo "Restarting existing PM2 process $PM2_NAME"
              pm2 restart "$PM2_NAME" --update-env || pm2 restart ecosystem.config.cjs --update-env
            else
              echo "Starting new PM2 process $PM2_NAME"
              if [ -f ecosystem.config.cjs ]; then
                pm2 start ecosystem.config.cjs --env production
              else
                pm2 start .next/standalone/server.js --name "$PM2_NAME" -- --port "$APP_PORT" --hostname 0.0.0.0
              fi
            fi

            pm2 save || true
            pm2 startup -u "$(whoami)" --hp "$(eval echo ~$(whoami))" 2>&1 | tail -n 5 || true

            echo "PM2 list (both intended and protected should show):"
            pm2 list
            pm2 describe "$PM2_NAME" | head -n 50 || true

            # ---- 9. Confirm app listens on port 3044 ----
            echo "Waiting for app to listen on port $APP_PORT..."
            for i in {1..30}; do
              if ss -tlnp | grep -q ":$APP_PORT"; then
                echo "✓ Port $APP_PORT is listening (attempt $i)"
                break
              fi
              echo "  Waiting for port $APP_PORT... ($i/30)"
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "::error::Port $APP_PORT not listening after 60s"
                pm2 logs "$PM2_NAME" --lines 100 --nostream || true
                exit 1
              fi
            done

            # Verify protected port still listening
            if ss -tlnp | grep -q ":$PROTECTED_PORT"; then
              echo "✓ Protected port $PROTECTED_PORT still listening — $PROTECTED_PM2 unaffected"
            else
              echo "::warning::Protected port $PROTECTED_PORT not listening — check $PROTECTED_PM2 manually (we did NOT touch it)"
            fi

            # ---- 10. Local health checks ----
            echo "Running local health checks..."
            sleep 3
            LOCAL_HEALTH="http://127.0.0.1:${APP_PORT}/api/health"
            echo "Curl $LOCAL_HEALTH"
            curl -fsS --max-time 15 "$LOCAL_HEALTH" | head -c 2000 || {
              echo "::error::Local health check failed at $LOCAL_HEALTH"
              pm2 logs "$PM2_NAME" --lines 150 --nostream || true
              exit 1
            }
            echo ""
            echo "✓ Local health check passed"

            for path in "/" "/api/health" "/universities" "/courses" "/destinations"; do
              url="http://127.0.0.1:${APP_PORT}${path}"
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              echo "  Local $path -> HTTP $code"
            done

            # ---- 11. Public domain health check ----
            echo "Public domain health check for $PRIMARY_DOMAIN..."
            for proto in https http; do
              url="${proto}://${PRIMARY_DOMAIN}/api/health"
              echo "Trying $url"
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              echo "  $url -> HTTP $code"
              if [ "$code" = "200" ]; then
                echo "✓ Public health check passed via $proto"
                curl -fsS --max-time 15 "$url" | head -c 2000 || true
                echo ""
                break
              fi
            done

            for proto in https http; do
              url="${proto}://${PRIMARY_DOMAIN}/"
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$url" || echo "000")
              echo "  Public homepage $url -> HTTP $code"
              if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
                echo "✓ Public homepage reachable via $proto"
                break
              fi
            done

            # ---- 12. Reverse proxy verification (do NOT modify protected domain) ----
            echo "Checking reverse proxy config..."
            if [ -f /etc/caddy/Caddyfile ]; then
              echo "Caddyfile:"
              cat /etc/caddy/Caddyfile | head -n 150 || true
              if grep -q "$APP_PORT" /etc/caddy/Caddyfile; then
                echo "✓ Caddyfile proxies to $APP_PORT"
              else
                echo "::warning::Caddyfile does not proxy to $APP_PORT — may need manual update (backup first, nginx -t, reload only after validation)"
              fi
              if grep -q "$PROTECTED_DOMAIN" /etc/caddy/Caddyfile; then
                echo "✓ Caddyfile contains protected domain $PROTECTED_DOMAIN — will NOT modify"
              fi
            fi
            if [ -d /etc/nginx/sites-enabled ] || [ -d /etc/nginx/conf.d ]; then
              echo "Nginx configs:"
              grep -R "proxy_pass.*$APP_PORT\|proxy_pass.*$PROTECTED_PORT\|$PRIMARY_DOMAIN\|$PROTECTED_DOMAIN" /etc/nginx/ 2>/dev/null | head -n 30 || true
            fi

            # ---- 13. Final verification ----
            echo "============================================================"
            echo " Deployment Summary"
            echo " Deployed Commit: $(git rev-parse HEAD)"
            echo " Previous Commit: $PREV_COMMIT"
            echo " Deploy Dir: $DEPLOY_DIR"
            echo " PM2 Process: $PM2_NAME (protected $PROTECTED_PM2 untouched)"
            echo " App Port: $APP_PORT (protected $PROTECTED_PORT untouched)"
            echo " Domain: $PRIMARY_DOMAIN (protected $PROTECTED_DOMAIN untouched)"
            echo " Backup Dir: $BACKUP_DIR"
            echo "============================================================"
            pm2 list
            ss -tlnp | grep -E ":$APP_PORT|:$PROTECTED_PORT" || true
            curl -fsS --max-time 10 "http://127.0.0.1:${APP_PORT}/api/health" | head -c 1000 || true
            echo ""
            echo "✓ Deployment completed successfully — protected service untouched"

      - name: Post-deploy public check (from runner)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Post-deploy public check from GitHub runner (best-effort)"
          for url in "https://aloeducation.com/api/health" "https://aloeducation.com/" "http://aloeducation.com/api/health"; do
            echo "Checking $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "$url" || echo "000")
            echo "  -> HTTP $code"
            if [ "$code" = "200" ]; then
              curl -s --max-time 15 "$url" | head -c 2000 || true
              echo ""
            fi
          done
          echo "Runner post-check complete"
