# ============================================================================
# ALO Education — Pull Request Validation (CI)
#
# Purpose: prove a PR is safe BEFORE it can reach main (main pushes are gated
# again by deploy-production.yml's validate-and-build job, which deploys only
# the exact validated SHA — so checks are not duplicated on main pushes).
#
# Triggers: pull_request targeting main + manual dispatch.
# Never deploys. Uses NO repository secrets, so pull requests from forks are
# safe (fork PRs get a read-only GITHUB_TOKEN and no secrets by design).
#
# Success condition: every job below completes with conclusion=success.
# DB-integration tests self-skip (reported as skipped, never "passed") when no
# disposable test DATABASE_URL is configured; they must never point at
# production.
# ============================================================================

name: CI — Pull Request Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality-gates:
    name: Lint · Typecheck · Tests · Prisma · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR commit
        # actions/checkout v7.0.1 — pinned to immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node v7.0.0 — pinned to immutable SHA
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile (reproducible)
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo "::error::package-lock.json missing"; exit 1; }
          npm ci

      - name: Secret-leak scan (tracked files)
        run: |
          set -euo pipefail
          echo "Scanning tracked files for credential-shaped strings..."
          # Excluded paths: workflow files (contain documented dummy build-check
          # values), env EXAMPLE templates (contain REPLACE_* placeholders),
          # docs/markdown. Matches containing obvious placeholder words are
          # filtered out; anything left is treated as a hard failure.
          HITS=$(git grep -InE \
            -e '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY' \
            -e 'mysql://[^"'"'"' ]+:[^"'"'"' @]+@' \
            -e 'postgres(ql)?://[^"'"'"' ]+:[^"'"'"' @]+@' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'github_pat_[A-Za-z0-9_]{20,}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- . ':!.github' ':!docs' ':!*.md' ':!*.example' ':!*example*' \
            | grep -viE 'REPLACE|dummy|placeholder|CHANGE_?ME|YOUR_|xxxxxxxx|<[^>]+>' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible committed secrets (file:line listed, values NOT echoed):"
            echo "$HITS" | cut -d: -f1,2
            exit 1
          fi
          echo "✓ No secret-shaped strings in tracked source files"

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate (needed for typecheck)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (blocking; DB-integration files skip-with-reason when no test DATABASE_URL)
        run: npm test

      - name: Production build (dummy env, runner validation only)
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy_build_check"
          NEXTAUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          AUTH_SECRET: "dummy-build-secret-for-validation-only-32chars"
          JWT_SECRET: "dummy-build-secret-for-validation-only-32chars"
          SESSION_SECRET: "dummy-build-secret-for-validation-only-32chars"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_URL: "https://aloeducation.com"
          NEXT_PUBLIC_APP_URL: "https://aloeducation.com"
          FILE_SIGN_SECRET: "dummy-file-sign-secret-must-be-32-chars-long-at-least"
        run: |
          set -euo pipefail
          npm run build
          test -f .next/standalone/server.js || { echo "::error::standalone server.js missing"; exit 1; }
          echo "✓ Build succeeded"

      - name: Summary
        if: always()
        run: |
          echo "### CI result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job conclusion: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow NEVER deploys. Production deployment only happens from main via deploy-production.yml." >> "$GITHUB_STEP_SUMMARY"
